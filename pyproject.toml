[tool.poetry]
name = "agent-judges"
version = "0.1.0"
description = "Adversarial multi-agent review system for AI-generated artifacts"
authors = ["Mingchen Zhuge <mingchen.zhuge@kaust.edu.sa>", "adversarial-judge contributors"]
license = "MIT"
readme = "README.md"
packages = [{ include = "agent_judges", from = "src" }]

[tool.poetry.dependencies]
# litellm requires python >=3.10,<3.15 — keep the project range inside it
python = ">=3.11,<3.15"
litellm = ">=1.100.0"
tenacity = ">=8.2.3"
pydantic = ">=2.0"
typer = ">=0.12"
rich = ">=13.0"
pyyaml = ">=6.0"
tiktoken = ">=0.9.0"
python-dotenv = ">=1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.3"
pytest-cov = ">=5.0.0"

[tool.poetry.scripts]
agent-judges = "agent_judges.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests that call real LLM APIs (need ANTHROPIC_API_KEY; deselect with '-m \"not integration\"')",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
